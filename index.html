    body{background:#000;color:#fff;font-family:'Roboto',sans-serif;overflow:hidden;height:100vh;width:100vw}
    .hero{position:relative;width:100%;height:33vh;overflow:hidden}

    /* Layer 1 – red radial background */
    .layer-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}

    /* Layer 3 – solid red gradient text (behind person) */
    .layer-solid-text{
      position:absolute;bottom: 3%;left:0;width:100%;z-index:3;pointer-events:none;
    animation-name: slidleft;
      animation-duration: 1s;
      animation-timing-function: ease-in;
      animation-delay: 0s;
      animation-fill-mode: forwards;
}

@keyframes slidleft {
  0% {
    left: -500px; /* Unit 'px' add kiya gaya hai */
  }
  100% {
    left: 0px;
  }
}

    /* Layer 4 – person cutout */
    .layer-person{
      position:absolute;
      bottom:0;
      left:40%;
      transform:translateX(-42%);
      height:88%;z-index:4;
      pointer-events:none;
      animation-name: pullup;
      animation-duration: 1s;
      animation-timing-function: ease-in;
      animation-delay: 0s;
      animation-fill-mode: forwards;
}

@keyframes pullup {
  0% {
    bottom: -500px; /* Unit 'px' add kiya gaya hai */
  }
  100% {
    bottom: 0px;
  }
}

    /* Layer 5 – outline text (over person) */
    .layer-outline-text{
      position:absolute;bottom: 3%;left:0;width:100%;z-index:5;pointer-events:none;
    animation-name: slidleft1;
      animation-duration: 1s;
      animation-timing-function: ease-in;
      animation-delay: 0s;
      animation-fill-mode: forwards;
}

@keyframes slidleft1 {
  0% {
    left: 500px; /* Unit 'px' add kiya gaya hai */
  }
  100% {
    left: 0px;
  }
}

    /* Layer 6 – social icons */
    .layer-socials{
      position:absolute;bottom:0;left:0;width:100%;z-index:7;pointer-events:none;
    }
